<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiken Store - Iniciar Sesion</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/" class="logo">Shiken<span class="logo-accent">Store</span></a>
        </div>
        <div class="nav-links">
            <a th:href="@{/inicio}">Inicio</a>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h2>Bienvenido</h2>
            <p class="login-subtitle">Accede a tu cuenta para comprar</p>

            <div th:if="${param.error}" class="alert alert-error">
                Usuario o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                Has cerrado sesion exitosamente.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Tu usuario" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn-primary btn-full">Iniciar Sesion</button>
            </form>

            <hr class="login-divider">

            <div class="login-help">
                <p>Usuarios disponibles</p>
                <table class="users-table">
                    <tr><th>Usuario</th><th>Contraseña</th></tr>
                    <tr><td>cliente1</td><td>password123</td></tr>
                    <tr><td>cliente2</td><td>password123</td></tr>
                    <tr><td>admin</td><td>admin123</td></tr>
                </table>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Shiken Store</p>
    </footer>
</body>
</html>
