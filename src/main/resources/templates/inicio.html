<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiken Store - Tienda Online</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/" class="logo">Shiken<span class="logo-accent">Store</span></a>
        </div>
        <div class="nav-links">
            <a href="/inicio" class="active">Inicio</a>
            <span sec:authorize="isAuthenticated()">
                <a href="/logout" class="btn-login">Salir</a>
            </span>
            <span sec:authorize="!isAuthenticated()">
                <a href="/login" class="btn-login">Entrar</a>
            </span>
        </div>
    </nav>

    <section class="banner">
        <div class="banner-content">
            <span class="banner-label">Tienda Online</span>
            <h1>Bienvenido a Shiken Store</h1>
            <p>Tu tienda online de confianza</p>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Shiken Store</p>
    </footer>
</body>
</html>
